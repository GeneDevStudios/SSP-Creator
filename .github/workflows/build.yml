name: Build & Release

on:
  push:
    tags:
      - 'v*'         # Triggers on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Manual trigger for testing builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: '*.dmg'
          - os: windows-latest
            platform: win
            artifact: '*.exe'
          - os: ubuntu-latest
            platform: linux
            artifact: '*.AppImage'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3 -v 29.1.0
        shell: bash

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron (${{ matrix.platform }})
        env:
          # Code signing — leave blank until certs are obtained
          # Mac: set CSC_LINK and CSC_KEY_PASSWORD in GitHub secrets
          # Win: set CSC_LINK and CSC_KEY_PASSWORD in GitHub secrets
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anvil-forge-${{ matrix.platform }}
          path: |
            dist/${{ matrix.artifact }}
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}